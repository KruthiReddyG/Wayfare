spring.application.name=smart-carpool
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_carpool?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
app.jwt.secret=${JWT_SECRET:SmartCarpoolJwtSecretKeyChangeMe-2026!}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:720}
app.seed-demo=${SEED_DEMO:true}